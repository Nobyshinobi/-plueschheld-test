<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1b1430;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #title,
      #subtitle {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
      }
      #title {
        top: 380px;
        line-height: 1.1;
        color: #fff7e8;
        font-size: 120px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #subtitle {
        top: 580px;
        line-height: 1.2;
        color: #ffc56b;
        font-size: 48px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="0">PlüschHeld</h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="4" data-track-index="1">HyperFrames-Test</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.9);
      tl.to(["#title", "#subtitle"], { opacity: 0, duration: 0.5 }, 3.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
